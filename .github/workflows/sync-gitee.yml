name: Sync Modsync to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modsync-gitee-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'QR-Not-Code/Modsync'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GIT_TERMINAL_PROMPT: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      # Destination supplied by the repository owner; no address secret needed.
      GITEE_REPOSITORY: QR_Not_Code/modsync
    steps:
      - name: Fetch GitHub main and full Git history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          lfs: false

      - name: Configure Gitee SSH credentials
        shell: bash
        env:
          GITEE_PRIVATE_KEY: ${{ secrets.GITEE_PRIVATE_KEY }}
          GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$GITEE_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]] || {
            echo "::error::Invalid Gitee owner/repository path in workflow."
            exit 1
          }
          [[ -n "$GITEE_PRIVATE_KEY" && -n "$GITEE_KNOWN_HOSTS" ]] || {
            echo "::error::Missing GITEE_PRIVATE_KEY or GITEE_KNOWN_HOSTS secret."
            exit 1
          }
          umask 077
          auth_dir="$RUNNER_TEMP/modsync-gitee-auth"
          mkdir -p "$auth_dir"
          printf '%s\n' "$GITEE_PRIVATE_KEY" | tr -d '\r' > "$auth_dir/key"
          printf '%s\n' "$GITEE_KNOWN_HOSTS" | tr -d '\r' > "$auth_dir/known_hosts"
          ssh-keygen -F gitee.com -f "$auth_dir/known_hosts" > /dev/null
          printf 'GIT_SSH_COMMAND=ssh -i "%s/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="%s/known_hosts"\n' "$auth_dir" "$auth_dir" >> "$GITHUB_ENV"
          git remote add gitee "git@gitee.com:${GITEE_REPOSITORY}.git"

      - name: Check destination repository access
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote gitee > /dev/null

      - name: Fetch and verify GitHub LFS objects
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          # Include historical objects: Modsync manifests pin ancestor commits.
          git lfs fetch --all origin HEAD
          git lfs fsck --objects HEAD

      - name: Upload actual LFS objects to Gitee first
        shell: bash
        run: |
          set -euo pipefail
          # A failure here stops the job; the Gitee branch remains unchanged.
          git lfs push --all gitee HEAD

      - name: Publish main after LFS upload succeeds
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          [[ "$latest" == "$expected" ]] || {
            echo "::error::GitHub main changed during upload. A newer push run, or a manual rerun, must publish the latest snapshot."
            exit 1
          }
          # Normal fast-forward push; never force-overwrite independent Gitee edits.
          git push --progress gitee HEAD:refs/heads/main
          actual=$(git ls-remote gitee refs/heads/main | cut -f1)
          [[ "$actual" == "$expected" ]] || {
            echo "::error::Gitee main commit verification failed."
            exit 1
          }
          {
            echo '### Gitee synchronization succeeded'
            echo "GitHub/Gitee main commit: \`$expected\`"
            echo 'LFS objects were uploaded before publishing main.'
            echo 'modsync-count.txt and the download manifest were copied without modification.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/modsync-gitee-auth/key" "$RUNNER_TEMP/modsync-gitee-auth/known_hosts"
